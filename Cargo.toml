[package]
name = "ludared"
version = "0.1.0"
edition = "2024"

authors = ["Arnaud 'red' Rouyer"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/joshleaves/ludared"
repository = "https://github.com/joshleaves/ludared"

# The binary fixtures the test suite decodes are not part of the source package.
exclude = ["src/testing/fixtures/data/**"]

[[bin]]
name = "ludared"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
hadris-iso = "=2.5.0"
hex = "0.4.3"
itertools = "0.15.0"
log = "0.4.34"
mlua = { version = "0.12.2", features = ["lua55", "vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
stderrlog = "0.6.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
uuid = { version = "1.28.0", features = ["v4"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
