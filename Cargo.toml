[package]
name = "ludared"
description = "Tool for unpacking, editing, and repacking game archives, designed for romhacking and modding workflows"
version = "0.12.0"
edition = "2024"

authors = ["Arnaud 'red' Rouyer"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/joshleaves/ludared"
repository = "https://github.com/joshleaves/ludared"

[lib]
name = "ludared"
path = "src/lib.rs"

[[bin]]
name = "ludared"
path = "src/main.rs"

[features]
profiling = ["dep:tracing", "dep:tracing-chrome", "dep:tracing-subscriber"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
hex = "0.4.3"
itertools = "0.15.0"
log = "0.4.34"
mlua = { version = "0.12.2", features = ["lua55", "vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
stderrlog = "0.6.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"], optional = true }
tracing-chrome = { version = "0.7", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }

[dev-dependencies]
hadris-iso = "=2.5.0"
uuid = { version = "1.29.0", features = ["v4"] }
prs-rs = "2.0.3"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
